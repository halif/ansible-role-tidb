---
- name: Download TiUP install script
  ansible.builtin.get_url:
    url: "{{ tiup_install_url }}"
    dest: /tmp/tiup-install.sh
    mode: '0755'

- name: Run TiUP install script for {{ tidb_user }}
  ansible.builtin.command: /tmp/tiup-install.sh
  args:
    creates: "{{ tiup_bin_dir }}/tiup"
  become: true
  become_user: "{{ tidb_user }}"
  become_method: ansible.builtin.su
  environment:
    HOME: "{{ tidb_home }}"

- name: Deploy shell profile snippet with TiUP on PATH
  ansible.builtin.template:
    src: tiup-env.sh.j2
    dest: /etc/profile.d/tiup.sh
    owner: root
    group: root
    mode: '0644'
