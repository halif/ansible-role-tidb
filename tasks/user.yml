---
- name: Create group for TiDB service user
  ansible.builtin.group:
    name: "{{ tidb_group }}"
    state: present

- name: Create TiDB service user
  ansible.builtin.user:
    name: "{{ tidb_user }}"
    group: "{{ tidb_group }}"
    home: "{{ tidb_home }}"
    shell: /bin/bash
    create_home: true
    state: present
