---
- name: Verify
  hosts: all
  become: true
  tasks:
    - name: Wait for TiDB playground systemd service to become active
      ansible.builtin.systemd:
        name: "{{ tidb_playground_service_name | default('tidb-playground') }}"
      register: svc_facts
      until: svc_facts.status.ActiveState == 'active'
      retries: 12
      delay: 5

    - name: Verify TiDB SQL port 4000 is listening
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 4000
        timeout: 180

    - name: Verify TiDB status endpoint responds with HTTP 200
      ansible.builtin.uri:
        url: "http://127.0.0.1:10080/status"
        status_code: 200
      register: status_check
      retries: 10
      delay: 5
      until: status_check.status == 200
